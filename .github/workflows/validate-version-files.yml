name: Validate version manifests

on:
  push:
    paths:
      - "version-*.json"
      - "schema/version.schema.json"
  pull_request:
    paths:
      - "version-*.json"
      - "schema/version.schema.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ajv-cli
        run: npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1

      - name: Validate JSON against schema
        run: |
          for f in version-tv.json version-mobile.json; do
            echo "Validating $f"
            ajv validate -c ajv-formats --spec=draft7 -s schema/version.schema.json -d "$f"
          done

      - name: Check versionCode, versionName and updateUrl agree
        run: |
          for f in version-tv.json version-mobile.json; do
            flavor=${f#version-}; flavor=${flavor%.json}
            code=$(jq -r '.versionCode' "$f")
            name=$(jq -r '.versionName' "$f")
            url=$(jq -r '.updateUrl' "$f")
            if [[ "$name" != *".$code-$flavor" ]]; then
              echo "::error file=$f::versionName $name doesn't end in .$code-$flavor"
              exit 1
            fi
            if [[ "$url" != */releases/download/v$code/io-player-$flavor.apk ]]; then
              echo "::error file=$f::updateUrl $url isn't the v$code io-player-$flavor.apk release asset"
              exit 1
            fi
          done

      # A missing or stale sha256 is only a warning here: sync-sha256.yml corrects it right after
      # every manifest push, so failing the release push over it would just be noise.
      - name: Verify updateUrl asset exists and check sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in version-tv.json version-mobile.json; do
            url=$(jq -r '.updateUrl' "$f")
            expected_sha=$(jq -r '.sha256' "$f")

            # updateUrl looks like https://github.com/<owner>/<repo>/releases/download/<tag>/<asset>
            path=${url#https://github.com/}
            owner=$(echo "$path" | cut -d/ -f1)
            repo=$(echo "$path" | cut -d/ -f2)
            tag=$(echo "$path" | cut -d/ -f5)
            asset=$(echo "$path" | cut -d/ -f6)

            echo "Checking $owner/$repo release $tag asset $asset"

            # Release tooling can push the manifest before the APK finishes uploading, so wait for
            # it (same budget as sync_sha256.py) rather than failing a release that is fine.
            digest=""
            for attempt in $(seq 1 10); do
              release_json=$(curl -sS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$owner/$repo/releases/tags/$tag")
              digest=$(echo "$release_json" | jq -r --arg name "$asset" '.assets[]? | select(.name == $name and .state == "uploaded") | .digest')
              if [ -n "$digest" ] && [ "$digest" != "null" ]; then
                break
              fi
              if [ "$attempt" -lt 10 ]; then
                echo "$tag/$asset isn't uploaded yet, checking again in 30s"
                sleep 30
              fi
            done

            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "::error file=$f::Could not find release asset $asset in $owner/$repo release $tag"
              exit 1
            fi

            actual_sha=${digest#sha256:}
            actual_sha=$(echo "$actual_sha" | tr '[:upper:]' '[:lower:]')

            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::warning file=$f::sha256 for $asset is ${expected_sha} but the release asset is $actual_sha; sync-sha256 will correct it"
            else
              echo "OK: $asset sha256 matches manifest"
            fi
          done

  versioncode-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject versionCode decreases
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi

          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous ref to compare against, skipping."
            exit 0
          fi

          for f in version-tv.json version-mobile.json; do
            old_json=$(git show "$base_ref:$f" 2>/dev/null || true)
            if [ -z "$old_json" ]; then
              echo "$f did not exist at $base_ref, skipping."
              continue
            fi

            old_code=$(echo "$old_json" | jq '.versionCode')
            new_code=$(jq '.versionCode' "$f")

            echo "$f: $old_code -> $new_code"

            if [ "$new_code" -lt "$old_code" ]; then
              echo "::error file=$f::versionCode decreased from $old_code to $new_code (rollback attacks are not allowed)"
              exit 1
            fi
          done
